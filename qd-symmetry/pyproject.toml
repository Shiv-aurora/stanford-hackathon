[project]
name = "symqd"
version = "0.1.0"
description = "Exploiting known symmetry groups in MAP-Elites archives (QDax)"
requires-python = ">=3.10,<3.13"
# Pinned to a combination that works with QDax 0.5.0: newer JAX removed the
# jnp.clip(a_min=...) keywords QDax's wrappers use, and newer Brax/MuJoCo
# releases do not match this JAX.
dependencies = [
    "qdax==0.5.0",
    "jax==0.5.3",
    "jaxlib==0.5.3",
    "brax==0.12.3",
    "flax==0.10.6",
    "mujoco==3.3.7",
    "mujoco-mjx==3.3.7",
    "chex==0.1.89",
    "optax==0.2.4",
    "orbax-checkpoint==0.11.19",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.5.3"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["symqd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Brax Ant tests (run with --run-slow)"]
