[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "constellation"
version = "0.1.0"
description = "Secure parallel agent swarm: compartmentalized workers run as Flower ClientApps, each seeing only its own context slice."
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "flwr[simulation]>=1.20",
]

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.flwr.app]
publisher = "your-flower-username"  # TODO: set to your Flower account username before publishing

[tool.flwr.app.components]
serverapp = "services.flower_app:server_app"
clientapp = "services.flower_app:client_app"

[tool.flwr.app.config]
prompt = ""  # confidential mission; empty runs the built-in AI-research demo
attack = ""  # worker role to hit with the demo prompt-injection attack, e.g. "literature"
timeout = 120

