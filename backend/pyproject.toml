[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "constellation"
version = "0.1.0"
description = "Secure parallel agent swarm: compartmentalized workers run as Flower ClientApps, each seeing only its own context slice."
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "cryptography>=44",
    "pydantic>=2",
    "flwr[simulation]>=1.39.0,<2.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.flwr.app]
publisher = "qxh2001"
display-name = "Constellation"
fab-format-version = 1
flwr-version-target = "1.39.0"

[tool.flwr.app.components]
serverapp = "services.flower_app:server_app"
clientapp = "services.flower_app:client_app"

[tool.flwr.app.config]
prompt = ""  # confidential mission; empty runs the built-in AI-research demo
attack = ""  # worker role to hit with the demo prompt-injection attack, e.g. "literature"
timeout = 120


# Shared run-config: never put mission text or credentials here for remote runs.
bridge-url = ""
mission-id = ""
min-nodes = 9
control-ttl = 900

# Dedicated trusted relay, excluded from worker allocation.
control-node-id = ""
